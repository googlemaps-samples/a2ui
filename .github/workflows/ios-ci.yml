name: iOS CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: iOS CI / build
    # Pinned to macos-15 so the bundled Xcode and iOS Simulator lineup stay stable.
    # zizmor: ignore[unpinned-images]
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout samples repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: a2ui-samples
          persist-credentials: false

      - name: Resolve core SDK branch
        id: core_ref
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          RESOLVED_REF="main"
          case "$HEAD_REF" in
            test_*)
              # Poll up to 80s for the parallel Copybara-Review-a2ui-core export to push test_<OCL>.
              for ATTEMPT in $(seq 1 9); do
                if git ls-remote --exit-code --heads https://github.com/googlemaps/a2ui.git "refs/heads/$HEAD_REF" >/dev/null 2>&1; then
                  RESOLVED_REF="$HEAD_REF"
                  break
                fi
                if [ "$ATTEMPT" -lt 9 ]; then
                  echo "Waiting 10s for Copybara to push $HEAD_REF to googlemaps/a2ui (attempt $ATTEMPT/9)..."
                  sleep 10
                fi
              done
              if [ "$RESOLVED_REF" = "main" ]; then
                echo "::warning::Branch $HEAD_REF not found on googlemaps/a2ui after 80s; falling back to main."
              fi
              ;;
          esac
          echo "Using googlemaps/a2ui ref: $RESOLVED_REF"
          echo "ref=$RESOLVED_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout core SDK repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: googlemaps/a2ui
          ref: ${{ steps.core_ref.outputs.ref }}
          path: a2ui
          persist-credentials: false

      - name: Build and test sample app
        run: |
          xcodebuild build-for-testing \
            -project A2UI-Example.xcodeproj \
            -scheme A2UI-Example \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild test-without-building \
            -project A2UI-Example.xcodeproj \
            -scheme A2UI-Example \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:A2UI-ExampleTests \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
        working-directory: a2ui-samples/client/ios
